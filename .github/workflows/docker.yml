name: docker

# 构建并推送镜像到 GitHub Container Registry (GHCR)。
# 推完后用 docker-compose.yml 即可直接拉取启动。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR 要求镜像路径全小写，而仓库名（ChouHX）含大写，必须显式转换。
      # 直接用 github.repository 会得到 ghcr.io/ChouHX/travel 而推送失败。
      - name: 计算小写镜像名
        id: repo
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short,prefix=sha-

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions 缓存：首次构建较慢（要装 npm 依赖 + 打包前端），之后会快很多
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出镜像地址
        run: |
          echo "### 镜像已推送" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**首次推送后，请到仓库的 Packages 页面把该包设为 Public**，" >> "$GITHUB_STEP_SUMMARY"
          echo "否则 \`docker compose up -d\` 拉取时需要先 \`docker login ghcr.io\`。" >> "$GITHUB_STEP_SUMMARY"